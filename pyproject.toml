[project]
name = "realestate-ml"
version = "0.1.0"
description = "부동산 가격 흐름 추적, 저평가 탐지, 온비드 공매 분석"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "streamlit>=1.40",
    "plotly>=5.24",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "certifi>=2024.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.2",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/realestate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PIE", "BLE", "RUF100"]
ignore = ["E501"]  # 줄 길이는 formatter 가 맞춤 (한글은 폭 2로 세어져 과하게 걸림)

[tool.ruff.lint.isort]
known-first-party = ["realestate", "common"]

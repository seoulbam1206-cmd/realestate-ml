# 비밀이 아닌 설정만 둡니다. 인증키·비밀번호는 .env 에만.
rone:
  survey_csv: "(월) 매매가격지수_아파트.csv"      # 월간 매매가격지수(조사), 2026.6=100
  real_csv: "(월) 지역별 매매지수_아파트.csv"     # 실거래가격지수, 2026.6=100
  encoding: cp949

molit_apt_trade:
  base_url: https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev
  operation: getRTMSDataSvcAptTradeDev   # MVP 2 첫 호출로 확인
  daily_limit: 1000
  safe_limit: 950
  num_of_rows: 1000                      # 2026-10-29 확인: 1000 허용
  api_from_ym: "202609"                  # 이전 달(2020.1~2026.8)은 공개시스템 CSV (2026-10-29 변경)
  backfill_months: ["202610", "202609"]  # 최근 달부터
  backfill_daily_cap: 800                # 백필은 하루 이 횟수(오늘 전체 사용량 기준)까지만 쓰고 멈춤
  max_retries: 3                         # 실패 시 재시도 횟수 (재시도도 호출 1회로 셈)
  max_consecutive_fail: 5                # 연속으로 이만큼 실패하면 그날 실행 중단

onbid:
  code:        {base_url: https://apis.data.go.kr/B010003/OnbidCodeSrvc, operations: [getOnbidUsgCodeInfo, getOnbidDtlAddrInfo], daily_limit: 1000}
  pbanc_cltr:  {base_url: https://apis.data.go.kr/B010003/OnbidPbancCltrDtlSrvc2, daily_limit: 1000}
  bid_result:  {base_url: https://apis.data.go.kr/B010003/OnbidCltrBidRsltListSrvc2, daily_limit: 1000}
  rlst_detail: {base_url: https://apis.data.go.kr/B010003/OnbidRlstDtlSrvc2, daily_limit: 1000}
  rlst_list:   {base_url: https://apis.data.go.kr/B010003/OnbidRlstListSrvc2, daily_limit: 1000}

  pbanc_cltr:  {base_url: https://apis.data.go.kr/B010003/OnbidPbancCltrDtlSrvc2, daily_limit: 1000}
  bid_result:  {base_url: https://apis.data.go.kr/B010003/OnbidCltrBidRsltListSrvc2, daily_limit: 1000}
  rlst_detail: {base_url: https://apis.data.go.kr/B010003/OnbidRlstDtlSrvc2, daily_limit: 1000}
  rlst_list:   {base_url: https://apis.data.go.kr/B010003/OnbidRlstListSrvc2, daily_limit: 1000}

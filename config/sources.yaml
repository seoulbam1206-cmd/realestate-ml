# 비밀이 아닌 설정만 둡니다. 인증키·비밀번호는 .env 에만.
rone:
  survey_csv: "(월) 매매가격지수_아파트.csv"      # 월간 매매가격지수(조사), 2026.6=100
  real_csv: "(월) 지역별 매매지수_아파트.csv"     # 실거래가격지수, 2026.6=100
  encoding: cp949

molit_apt_trade:
  base_url: https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev
  operation: getRTMSDataSvcAptTradeDev   # MVP 2 첫 호출로 확인
  daily_limit: 1000
  safe_limit: 950
  num_of_rows: 1000
  api_from_ym: "202601"                  # 이전 달은 공개시스템 CSV

onbid:
